[package]
name = "fbr-planner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fbr-planner"
path = "src/main.rs"

[dependencies]
dioxus = { version = "0.7", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]

